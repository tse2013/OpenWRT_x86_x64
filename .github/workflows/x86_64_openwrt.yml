name: immortalwrt_x86_64

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.1
  CONFIG_FILE: immortalwrt/x86_64/defconfig
  DIY_P1_SH: immortalwrt/diy-part1.sh
  DIY_P2_SH: immortalwrt/diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  OPENWRT_NAME: immortalwrt
  OPENWRT_NAME1: x86_64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Record start time
      run: echo "START_TS=$(date +%s)" >> $GITHUB_ENV

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        
    - name: Check out the project branch
      uses: actions/checkout@main
      with:
          fetch-depth: 0
          
    - name: Clean build caches
      run: |
        echo "Cleaning previous build artifacts and caches..."
        sudo rm -rf $GITHUB_WORKSPACE/openwrt || true
        sudo rm -rf $RUNNER_TEMP/* || true
        sudo rm -rf $RUNNER_TOOL_CACHE/* || true
        sudo apt-get -qq clean || true
        sudo rm -rf /var/lib/apt/lists/* || true
        rm -rf ~/.cache/* || true
        echo "Cache cleanup complete."

    - name: Initialize the compilation environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        ( sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext \
        git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev swig libpython3-dev aria2 jq subversion qemu-utils ccache rename libelf-dev
        sudo -E apt-get -qq purge azure-cli ghc* zulu* hhvm llvm* firefox powershell openjdk* dotnet* google* mysql* php* android* rename speedtest-cli
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean ) &
        sudo timedatectl set-timezone "$TZ"
        
    - name: Initialize Environment and Display System Info
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        $GITHUB_WORKSPACE/$OPENWRT_NAME/system-Information.sh
        
    - name: Download firmware source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Load feeds.conf.default
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Load config
      run: |
        [ -e "$CONFIG_FILE" ] && cat "$CONFIG_FILE" > openwrt/.config
        chmod +x $OPENWRT_NAME/*.sh && cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        # 开启 ccache，配合下方缓存加速后续编译
        echo "CONFIG_CCACHE=y" >> .config

    # tools/toolchain 只取决于源码版本和目标平台，缓存后可省约 2 小时
    - name: Restore toolchain cache
      id: toolchain-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
        key: toolchain-${{ env.REPO_BRANCH }}-x86_64-ccache-v1

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: openwrt/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-x86_64-${{ github.run_id }}
        restore-keys: ccache-${{ env.REPO_BRANCH }}-x86_64-

    - name: Download the installation package
      id: package
      run: |
        cd openwrt
        make defconfig
        cat .config
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile tools and toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      run: |
        cd openwrt
        make tools/install -j$(nproc) || make tools/install -j1 V=s
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

    - name: Save toolchain cache
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
        key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        # tools/toolchain 已就绪（缓存恢复或上一步刚编好），去掉顶层依赖避免因源码时间戳较新而重编
        sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
        # 在 6 小时硬上限前主动停止，留时间保存 ccache
        remaining=$(( START_TS + 340*60 - $(date +%s) ))
        echo "$(nproc) thread compile, time budget $((remaining/60)) min"
        timeout ${remaining}s bash -c 'make -j$(nproc) || make -j1 V=s'
        echo "date1=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
        echo "date2=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: openwrt/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-x86_64-${{ github.run_id }}

    - name: Organize and Rename Files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages *rootfs.tar.gz *rootfs.img.gz *combined.img.gz *.bin *.config *.buildinfo *.json sha256sums *.manifest
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload the firmware to github
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.OPENWRT_NAME1 }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tags
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ env.date2 }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "📥 固件下载" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Publish to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.date2 }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
